spring:
  config:
    import: 'optional:file:../.env[.properties]'
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:${DB_PORT:5432}/${DB_NAME:learn_platform}}
    username: ${DB_USER:learn}
    password: ${DB_PASSWORD:learn_dev_password}
  flyway:
    locations: classpath:db/migration,classpath:db/demo

server:
  address: ${SERVER_ADDRESS:127.0.0.1}

app:
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

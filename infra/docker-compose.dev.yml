name: codelearn-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-learn_platform}
      POSTGRES_USER: ${DB_USER:-learn}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?Copy .env.example to .env first}']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 3s
      timeout: 3s
      retries: 15
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Copy .env.example to .env first}

  backend:
    profiles: [app]
    build:
      context: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: '8080'
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-learn_platform}
      DB_USER: ${DB_USER:-learn}
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Copy .env.example to .env first}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - '127.0.0.1:${SERVER_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:

name: Backend CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/codelearn-pr-title"
          sh .githooks/commit-msg "$RUNNER_TEMP/codelearn-pr-title"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: codelearn_test
          POSTGRES_USER: codelearn
          POSTGRES_PASSWORD: codelearn_test_password
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U codelearn -d codelearn_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/codelearn_test
      TEST_DB_USER: codelearn
      TEST_DB_PASSWORD: codelearn_test_password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build and test backend
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
      - name: Validate Compose configuration
        working-directory: .
        run: docker compose --env-file .env.example -f infra/docker-compose.dev.yml --profile app config --quiet
      - name: Build backend image
        run: docker build --tag codelearn/backend:ci .

name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infra/**'
      - 'docs/api/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'infra/**'
      - 'docs/api/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: codelearn_test
          POSTGRES_USER: codelearn
          POSTGRES_PASSWORD: codelearn_test_password
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U codelearn -d codelearn_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/codelearn_test
      TEST_DB_USER: codelearn
      TEST_DB_PASSWORD: codelearn_test_password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build and test backend
        run: bash ./mvnw --batch-mode --no-transfer-progress verify

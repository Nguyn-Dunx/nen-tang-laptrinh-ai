name: Frontend CI

on:
  push:
    branches: [master, main]
    paths: ['frontend/**', 'docs/api/openapi.yaml', '.github/workflows/frontend-ci.yml']
  pull_request:
    paths: ['frontend/**', 'docs/api/openapi.yaml', '.github/workflows/frontend-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:generate
      - name: Check OpenAPI type synchronization
        run: git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run check

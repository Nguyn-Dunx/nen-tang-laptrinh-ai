openapi: 3.0.3
info:
  title: CodeLearn API
  version: 0.1.0
  description: Hợp đồng API cho tài khoản, danh mục khóa học, bài học, bài tập đã xuất bản và trạng thái dịch vụ.
servers:
  - url: http://localhost:8080
    description: Backend cục bộ
tags:
  - name: Identity
    description: Đăng ký email, đăng nhập và quản lý phiên hiện tại.
  - name: Content
    description: Khóa học và bài học đã xuất bản.
  - name: Sandbox
    description: Bài tập lập trình đã xuất bản và test công khai.
  - name: Health
    description: Trạng thái ứng dụng và kết nối cơ sở dữ liệu.
paths:
  /api/v1/auth/csrf:
    get:
      tags: [Identity]
      operationId: getCsrfToken
      summary: Lấy CSRF token cho phiên hiện tại
      description: Giữ cookie phiên và gửi token trong header được trả về. Lấy lại token sau đăng ký, đăng nhập hoặc đăng xuất.
      responses:
        '200':
          description: Token CSRF của phiên hiện tại. Nếu cần, tạo phiên ẩn danh.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/register:
    post:
      tags: [Identity]
      operationId: registerAccount
      summary: Đăng ký tài khoản học viên bằng email
      description: Đăng ký từ phiên ẩn danh và bắt đầu phiên đã xác thực. Email lưu dạng chữ thường.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAccount'
      responses:
        '201':
          description: Đã tạo học viên và đổi ID phiên.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
            Location:
              description: Đường dẫn hồ sơ của tài khoản trong phiên mới.
              schema:
                type: string
                example: /api/v1/auth/me
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
        '400':
          $ref: '#/components/responses/InvalidCredentialsBody'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '409':
          $ref: '#/components/responses/EmailConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/login:
    post:
      tags: [Identity]
      operationId: loginWithEmail
      summary: Bắt đầu phiên đã xác thực bằng email và mật khẩu
      description: Dùng phiên ẩn danh có CSRF token. Đọc GET /api/v1/auth/me để lấy hồ sơ sau đăng nhập.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Đăng nhập thành công và đổi ID phiên.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
        '400':
          $ref: '#/components/responses/InvalidCredentialsBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/me:
    get:
      tags: [Identity]
      operationId: getCurrentAccount
      summary: Đọc hồ sơ của phiên hiện tại
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Hồ sơ tài khoản của phiên hiện tại.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      tags: [Identity]
      operationId: logoutAccount
      summary: Hủy phiên hiện tại
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Phiên bị xóa khỏi PostgreSQL và cookie phiên hết hạn.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Kiểm tra API có phản hồi
      responses:
        '200':
          description: API có thể xử lý yêu cầu HTTP.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: UP
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/courses:
    get:
      tags: [Content]
      operationId: listCourses
      summary: Liệt kê khóa học đã xuất bản
      description: Kết quả sắp xếp theo slug tăng dần. Trang vượt phạm vi trả về danh sách rỗng.
      parameters:
        - name: page
          in: query
          description: Chỉ số trang bắt đầu từ 0.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Số khóa học tối đa trên một trang.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Trang khóa học đã xuất bản.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePage'
        '400':
          $ref: '#/components/responses/InvalidPagination'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/courses/{courseSlug}:
    get:
      tags: [Content]
      operationId: getCourse
      summary: Lấy khóa học và mục lục bài học
      parameters:
        - $ref: '#/components/parameters/CourseSlug'
      responses:
        '200':
          description: Chi tiết khóa học cùng danh sách bài đã xuất bản theo thứ tự học.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '404':
          $ref: '#/components/responses/ContentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/courses/{courseSlug}/lessons/{lessonSlug}:
    get:
      tags: [Content]
      operationId: getLesson
      summary: Lấy nội dung bài học đã xuất bản
      parameters:
        - $ref: '#/components/parameters/CourseSlug'
        - name: lessonSlug
          in: path
          required: true
          description: Slug của bài học trong khóa học.
          schema:
            type: string
          example: xin-chao-python
      responses:
        '200':
          description: Nội dung bài học dạng Markdown.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonDetail'
        '404':
          $ref: '#/components/responses/ContentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/exercises/{exerciseId}:
    get:
      tags: [Sandbox]
      operationId: getExercise
      summary: Lấy bài tập đã xuất bản cùng test công khai
      description: Bài thuộc lesson hoặc course chưa xuất bản trả về 404. Test ẩn và lời giải tham khảo không được đưa vào response.
      parameters:
        - name: exerciseId
          in: path
          required: true
          description: ID bài tập.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Bài tập cùng các test công khai theo thứ tự chạy.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseView'
        '404':
          description: Bài tập không tồn tại hoặc lesson/course chưa xuất bản. Mã lỗi là EXERCISE_NOT_FOUND.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'
  /actuator/health/liveness:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Kiểm tra trạng thái sống của ứng dụng
      responses:
        '200':
          $ref: '#/components/responses/ProbeUp'
        '503':
          $ref: '#/components/responses/ProbeUnavailable'
  /actuator/health/readiness:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Kiểm tra ứng dụng sẵn sàng nhận yêu cầu
      description: Kiểm tra cả trạng thái sẵn sàng của ứng dụng và kết nối PostgreSQL.
      responses:
        '200':
          $ref: '#/components/responses/ProbeUp'
        '503':
          $ref: '#/components/responses/ProbeUnavailable'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: CODELEARN_SESSION
      description: ID phiên do server cấp qua cookie HttpOnly.
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: CSRF token lấy từ GET /api/v1/auth/csrf, gửi cùng cookie phiên tương ứng.
      schema:
        type: string
    CourseSlug:
      name: courseSlug
      in: path
      required: true
      description: Slug của khóa học.
      schema:
        type: string
      example: python-co-ban
  headers:
    SessionCookie:
      description: Cookie CODELEARN_SESSION có HttpOnly, SameSite=Lax và Secure ngoài profile dev.
      schema:
        type: string
    RequestId:
      description: ID yêu cầu do backend tạo, trùng với traceId trong lỗi API.
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidCredentialsBody:
      description: Email hoặc mật khẩu không đạt validation. Mã lỗi là VALIDATION_ERROR.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthenticated:
      description: Thiếu phiên hợp lệ hoặc thông tin đăng nhập sai. Mã lỗi là UNAUTHENTICATED.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    AuthForbidden:
      description: Thiếu CSRF hợp lệ hoặc trạng thái xác thực hiện tại không cho phép thao tác. Mã lỗi là FORBIDDEN.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    EmailConflict:
      description: Email đã đăng ký, so sánh không phân biệt hoa thường. Mã lỗi là CONFLICT.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InvalidPagination:
      description: Tham số phân trang không hợp lệ. Mã lỗi là VALIDATION_ERROR.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ContentNotFound:
      description: Khóa học hoặc bài học không tồn tại hoặc chưa xuất bản. Mã lỗi là NOT_FOUND.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalError:
      description: Lỗi xử lý nội bộ. Mã lỗi là INTERNAL_ERROR.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ProbeUp:
      description: Kiểm tra thành công.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthStatus'
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: '#/components/schemas/HealthStatus'
    ProbeUnavailable:
      description: Thành phần được kiểm tra đang DOWN hoặc OUT_OF_SERVICE.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthStatus'
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: '#/components/schemas/HealthStatus'
  schemas:
    CsrfToken:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
          example: X-CSRF-TOKEN
        token:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
    RegisterAccount:
      allOf:
        - $ref: '#/components/schemas/LoginRequest'
        - type: object
          properties:
            password:
              type: string
              minLength: 15
    AccountView:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        role:
          type: string
          enum: [LEARNER, AUTHOR, ADMIN]
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP
    ProblemDetail:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
          example: /api/v1/courses
        code:
          type: string
          description: Mã lỗi ổn định cho frontend.
          example: VALIDATION_ERROR
        traceId:
          type: string
          format: uuid
          example: 7fc54937-9385-4df5-9976-494338298a97
    CourseSummary:
      type: object
      required: [slug, title, summary]
      properties:
        slug:
          type: string
          example: python-co-ban
        title:
          type: string
          example: Python cơ bản
        summary:
          type: string
          example: Làm quen với cú pháp Python qua các ví dụ ngắn.
    CoursePage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CourseSummary'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: Tổng số khóa học đã xuất bản.
    CourseDetail:
      allOf:
        - $ref: '#/components/schemas/CourseSummary'
        - type: object
          required: [lessons]
          properties:
            lessons:
              type: array
              items:
                $ref: '#/components/schemas/LessonSummary'
    LessonSummary:
      type: object
      required: [slug, title, position]
      properties:
        slug:
          type: string
          example: xin-chao-python
        title:
          type: string
          example: Xin chào, Python
        position:
          type: integer
          format: int32
          minimum: 1
          example: 1
    LessonDetail:
      allOf:
        - $ref: '#/components/schemas/LessonSummary'
        - type: object
          required: [courseSlug, bodyMarkdown]
          properties:
            courseSlug:
              type: string
              example: python-co-ban
            bodyMarkdown:
              type: string
              description: Mã nguồn Markdown của bài học.
    ExerciseView:
      type: object
      required: [id, lessonId, title, language, difficulty, statementMarkdown, starterCode, maxScore, publicTests]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        lessonId:
          type: integer
          format: int64
        title:
          type: string
          example: Tính tổng hai số
        language:
          type: string
          example: python
        difficulty:
          type: string
          example: beginner
        statementMarkdown:
          type: string
          description: Đề bài dạng Markdown.
        starterCode:
          type: string
        maxScore:
          type: integer
          minimum: 1
          example: 100
        publicTests:
          type: array
          items:
            $ref: '#/components/schemas/PublicTestCase'
    PublicTestCase:
      type: object
      required: [position, stdin, expectedOutput]
      properties:
        position:
          type: integer
          format: int32
          minimum: 1
        stdin:
          type: string
        expectedOutput:
          type: string

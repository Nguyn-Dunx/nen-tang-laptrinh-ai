openapi: 3.0.3
info:
  title: CodeLearn API
  version: 0.1.0
  description: Hợp đồng API cho tài khoản, danh mục khóa học, bài học, bài tập đã xuất bản và trạng thái dịch vụ.
servers:
  - url: http://localhost:8080
    description: Backend cục bộ
tags:
  - name: Identity
    description: Đăng ký email, đăng nhập và quản lý phiên hiện tại.
  - name: Content
    description: Khóa học và bài học đã xuất bản.
  - name: Course Admin
    description: Quản trị khóa học và bài học. Yêu cầu phiên có vai trò ADMIN.
  - name: Sandbox
    description: Bài tập lập trình đã xuất bản và test công khai.
  - name: Health
    description: Trạng thái ứng dụng và kết nối cơ sở dữ liệu.
paths:
  /api/v1/courses/{courseSlug}/lessons/{lessonSlug}/exercises:
    get:
      tags: [Content]
      operationId: listPublishedLessonExercises
      summary: Tìm bài tập của bài học đã xuất bản
      parameters:
        - $ref: '#/components/parameters/CourseSlug'
        - $ref: '#/components/parameters/LessonSlug'
      responses:
        '200':
          description: Trả về dữ liệu yêu cầu.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LessonExerciseSummary'
        '404':
          $ref: '#/components/responses/ContentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/courses:
    get:
      tags: [Course Admin]
      operationId: listAdminCourses
      summary: Liệt kê khóa học, gồm cả bản nháp
      security:
        - SessionCookie: []
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: Trả về dữ liệu yêu cầu.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCoursePage'
        '400':
          $ref: '#/components/responses/CourseValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CourseAccessDenied'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Course Admin]
      operationId: createDraftCourse
      summary: Tạo khóa học nháp
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourse'
      responses:
        '201':
          description: Đã tạo bản nháp.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              description: Đường dẫn quản trị của bản nháp vừa tạo.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCourseDetail'
        '400':
          $ref: '#/components/responses/CourseValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CourseAccessDenied'
        '409':
          $ref: '#/components/responses/CourseConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/courses/{courseSlug}:
    get:
      tags: [Course Admin]
      operationId: getAdminCourse
      summary: Đọc chi tiết khóa học và thứ tự bài
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CourseSlug'
      responses:
        '200':
          description: Trả về dữ liệu yêu cầu.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCourseDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CourseAccessDenied'
        '404':
          $ref: '#/components/responses/CourseResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Course Admin]
      operationId: updateDraftCourse
      summary: Cập nhật khóa học nháp
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CourseSlug'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourse'
      responses:
        '200':
          description: Trả về dữ liệu yêu cầu.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCourseDetail'
        '400':
          $ref: '#/components/responses/CourseValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CourseAccessDenied'
        '404':
          $ref: '#/components/responses/CourseResourceNotFound'
        '409':
          $ref: '#/components/responses/CourseConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/courses/{courseSlug}/publication:
    put:
      tags: [Course Admin]
      operationId: setCoursePublication
      summary: Xuất bản hoặc thu hồi khóa học
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CourseSlug'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoursePublication'
      responses:
        '200':
          description: Trả về dữ liệu yêu cầu.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCourseDetail'
        '400':
          $ref: '#/components/responses/CourseValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CourseAccessDenied'
        '404':
          $ref: '#/components/responses/CourseResourceNotFound'
        '409':
          $ref: '#/components/responses/CourseConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/courses/{courseSlug}/lessons:
    post:
      tags: [Course Admin]
      operationId: createDraftLesson
      summary: Thêm bài nháp vào cuối khóa
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CourseSlug'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLesson'
      responses:
        '201':
          description: Đã tạo bản nháp.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              description: Đường dẫn quản trị của bản nháp vừa tạo.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLessonDetail'
        '400':
          $ref: '#/components/responses/CourseValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CourseAccessDenied'
        '404':
          $ref: '#/components/responses/CourseResourceNotFound'
        '409':
          $ref: '#/components/responses/CourseConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/courses/{courseSlug}/lessons/{lessonSlug}:
    get:
      tags: [Course Admin]
      operationId: getAdminLesson
      summary: Đọc bài học trong trang quản trị
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CourseSlug'
        - $ref: '#/components/parameters/LessonSlug'
      responses:
        '200':
          description: Trả về dữ liệu yêu cầu.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLessonDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CourseAccessDenied'
        '404':
          $ref: '#/components/responses/CourseResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Course Admin]
      operationId: updateDraftLesson
      summary: Cập nhật bài học nháp
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CourseSlug'
        - $ref: '#/components/parameters/LessonSlug'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLesson'
      responses:
        '200':
          description: Trả về dữ liệu yêu cầu.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLessonDetail'
        '400':
          $ref: '#/components/responses/CourseValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CourseAccessDenied'
        '404':
          $ref: '#/components/responses/CourseResourceNotFound'
        '409':
          $ref: '#/components/responses/CourseConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/courses/{courseSlug}/lessons/{lessonSlug}/publication:
    put:
      tags: [Course Admin]
      operationId: setLessonPublication
      summary: Xuất bản hoặc thu hồi bài học
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CourseSlug'
        - $ref: '#/components/parameters/LessonSlug'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoursePublication'
      responses:
        '200':
          description: Trả về dữ liệu yêu cầu.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLessonDetail'
        '400':
          $ref: '#/components/responses/CourseValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CourseAccessDenied'
        '404':
          $ref: '#/components/responses/CourseResourceNotFound'
        '409':
          $ref: '#/components/responses/CourseConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/courses/{courseSlug}/lesson-order:
    put:
      tags: [Course Admin]
      operationId: setLessonOrder
      summary: Sắp xếp toàn bộ bài học trong khóa
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CourseSlug'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonOrder'
      responses:
        '200':
          description: Trả về dữ liệu yêu cầu.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCourseDetail'
        '400':
          $ref: '#/components/responses/CourseValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CourseAccessDenied'
        '404':
          $ref: '#/components/responses/CourseResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/csrf:
    get:
      tags: [Identity]
      operationId: getCsrfToken
      summary: Lấy CSRF token cho phiên hiện tại
      description: Giữ cookie phiên và gửi token trong header được trả về. Lấy lại token sau đăng ký, đăng nhập hoặc đăng xuất.
      responses:
        '200':
          description: Token CSRF của phiên hiện tại. Nếu cần, tạo phiên ẩn danh.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/register:
    post:
      tags: [Identity]
      operationId: registerAccount
      summary: Đăng ký tài khoản học viên bằng email
      description: Đăng ký từ phiên ẩn danh và bắt đầu phiên đã xác thực. Email lưu dạng chữ thường.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAccount'
      responses:
        '201':
          description: Đã tạo học viên và đổi ID phiên.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
            Location:
              description: Đường dẫn hồ sơ của tài khoản trong phiên mới.
              schema:
                type: string
                example: /api/v1/auth/me
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
        '400':
          $ref: '#/components/responses/InvalidCredentialsBody'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '409':
          $ref: '#/components/responses/EmailConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/login:
    post:
      tags: [Identity]
      operationId: loginWithEmail
      summary: Bắt đầu phiên đã xác thực bằng email và mật khẩu
      description: Dùng phiên ẩn danh có CSRF token. Đọc GET /api/v1/auth/me để lấy hồ sơ sau đăng nhập.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Đăng nhập thành công và đổi ID phiên.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
        '400':
          $ref: '#/components/responses/InvalidCredentialsBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/me:
    get:
      tags: [Identity]
      operationId: getCurrentAccount
      summary: Đọc hồ sơ của phiên hiện tại
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Hồ sơ tài khoản của phiên hiện tại.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      tags: [Identity]
      operationId: logoutAccount
      summary: Hủy phiên hiện tại
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Phiên bị xóa khỏi PostgreSQL và cookie phiên hết hạn.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Kiểm tra API có phản hồi
      responses:
        '200':
          description: API có thể xử lý yêu cầu HTTP.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: UP
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/courses:
    get:
      tags: [Content]
      operationId: listCourses
      summary: Liệt kê khóa học đã xuất bản
      description: Kết quả sắp xếp theo slug tăng dần. Trang vượt phạm vi trả về danh sách rỗng.
      parameters:
        - name: page
          in: query
          description: Chỉ số trang bắt đầu từ 0.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Số khóa học tối đa trên một trang.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Trang khóa học đã xuất bản.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePage'
        '400':
          $ref: '#/components/responses/InvalidPagination'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/courses/{courseSlug}:
    get:
      tags: [Content]
      operationId: getCourse
      summary: Lấy khóa học và mục lục bài học
      parameters:
        - $ref: '#/components/parameters/CourseSlug'
      responses:
        '200':
          description: Chi tiết khóa học cùng danh sách bài đã xuất bản theo thứ tự học.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '404':
          $ref: '#/components/responses/ContentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/courses/{courseSlug}/lessons/{lessonSlug}:
    get:
      tags: [Content]
      operationId: getLesson
      summary: Lấy nội dung bài học đã xuất bản
      parameters:
        - $ref: '#/components/parameters/CourseSlug'
        - name: lessonSlug
          in: path
          required: true
          description: Slug của bài học trong khóa học.
          schema:
            type: string
          example: xin-chao-python
      responses:
        '200':
          description: Nội dung bài học dạng Markdown.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonDetail'
        '404':
          $ref: '#/components/responses/ContentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/exercises/{exerciseId}:
    get:
      tags: [Sandbox]
      operationId: getExercise
      summary: Lấy bài tập đã xuất bản cùng test công khai
      description: Bài thuộc lesson hoặc course chưa xuất bản trả về 404. Test ẩn và lời giải tham khảo không được đưa vào response.
      parameters:
        - name: exerciseId
          in: path
          required: true
          description: ID bài tập.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Bài tập cùng các test công khai theo thứ tự chạy.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseView'
        '404':
          description: Bài tập không tồn tại hoặc lesson/course chưa xuất bản. Mã lỗi là EXERCISE_NOT_FOUND.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/exercises/{exerciseId}/submissions:
    post:
      tags: [Sandbox]
      operationId: createSubmission
      summary: Nộp mã Python để chấm
      description: Lưu mã và trả ngay ID. Worker riêng thực thi qua Judge0; cần session đăng nhập và CSRF token.
      security:
        - SessionCookie: []
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmission'
      responses:
        '202':
          description: Bài nộp đã được lưu để xử lý.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              description: Đường dẫn để polling trạng thái bài nộp.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionReceipt'
        '400':
          $ref: '#/components/responses/InvalidCredentialsBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/ContentNotFound'
        '413':
          description: Mã nguồn lớn hơn giới hạn cấu hình.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          description: Đã vượt giới hạn tần suất hoặc số bài đang chờ.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Grader chưa sẵn sàng nhận bài.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    get:
      tags: [Sandbox]
      operationId: listExerciseSubmissions
      summary: Liệt kê lịch sử nộp của người dùng hiện tại
      description: Bài nộp của chính người dùng vẫn có thể tra cứu khi khóa hoặc bài học đã được thu hồi.
      security:
        - SessionCookie: []
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Trang lịch sử, không chứa mã nguồn hoặc dữ liệu test.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ContentNotFound'
  /api/v1/submissions/{submissionId}:
    get:
      tags: [Sandbox]
      operationId: getSubmission
      summary: Đọc trạng thái và kết quả chấm
      security:
        - SessionCookie: []
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Trạng thái và kết quả của chủ bài nộp. Test ẩn không có input/output.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Bài nộp không tồn tại hoặc không thuộc người dùng hiện tại.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/submissions/{submissionId}/detail:
    get:
      tags: [Sandbox]
      operationId: getSubmissionDetail
      summary: Đọc lại mã nguồn của chính bài nộp
      security:
        - SessionCookie: []
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Chi tiết bài nộp của chủ sở hữu.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Bài nộp không tồn tại hoặc không thuộc người dùng hiện tại.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /actuator/health/liveness:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Kiểm tra trạng thái sống của ứng dụng
      responses:
        '200':
          $ref: '#/components/responses/ProbeUp'
        '503':
          $ref: '#/components/responses/ProbeUnavailable'
  /actuator/health/readiness:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Kiểm tra ứng dụng sẵn sàng nhận yêu cầu
      description: Kiểm tra cả trạng thái sẵn sàng của ứng dụng và kết nối PostgreSQL.
      responses:
        '200':
          $ref: '#/components/responses/ProbeUp'
        '503':
          $ref: '#/components/responses/ProbeUnavailable'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: CODELEARN_SESSION
      description: ID phiên do server cấp qua cookie HttpOnly.
  parameters:
    LessonSlug:
      name: lessonSlug
      in: path
      required: true
      schema: {type: string}
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: CSRF token lấy từ GET /api/v1/auth/csrf, gửi cùng cookie phiên tương ứng.
      schema:
        type: string
    CourseSlug:
      name: courseSlug
      in: path
      required: true
      description: Slug của khóa học.
      schema:
        type: string
      example: python-co-ban
  headers:
    SessionCookie:
      description: Cookie CODELEARN_SESSION có HttpOnly, SameSite=Lax và Secure ngoài profile dev.
      schema:
        type: string
    RequestId:
      description: ID yêu cầu do backend tạo, trùng với traceId trong lỗi API.
      required: true
      schema:
        type: string
        format: uuid
  responses:
    CourseValidationError:
      description: Payload, phân trang hoặc thứ tự bài không hợp lệ. Mã lỗi VALIDATION_ERROR hoặc INVALID_LESSON_ORDER.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    CourseAccessDenied:
      description: Thiếu quyền ADMIN hoặc CSRF hợp lệ. Mã lỗi FORBIDDEN.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    CourseResourceNotFound:
      description: Khóa hoặc bài học không tồn tại. Mã lỗi COURSE_NOT_FOUND hoặc LESSON_NOT_FOUND.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    CourseConflict:
      description: Slug đã tồn tại, nội dung đang xuất bản hoặc khóa không đủ bài đã xuất bản.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InvalidCredentialsBody:
      description: Email hoặc mật khẩu không đạt validation. Mã lỗi là VALIDATION_ERROR.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthenticated:
      description: Thiếu phiên hợp lệ hoặc thông tin đăng nhập sai. Mã lỗi là UNAUTHENTICATED.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    AuthForbidden:
      description: Thiếu CSRF hợp lệ hoặc trạng thái xác thực hiện tại không cho phép thao tác. Mã lỗi là FORBIDDEN.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    EmailConflict:
      description: Email đã đăng ký, so sánh không phân biệt hoa thường. Mã lỗi là CONFLICT.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InvalidPagination:
      description: Tham số phân trang không hợp lệ. Mã lỗi là VALIDATION_ERROR.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ContentNotFound:
      description: Khóa học hoặc bài học không tồn tại hoặc chưa xuất bản. Mã lỗi là NOT_FOUND.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalError:
      description: Lỗi xử lý nội bộ. Mã lỗi là INTERNAL_ERROR.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ProbeUp:
      description: Kiểm tra thành công.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthStatus'
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: '#/components/schemas/HealthStatus'
    ProbeUnavailable:
      description: Thành phần được kiểm tra đang DOWN hoặc OUT_OF_SERVICE.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthStatus'
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: '#/components/schemas/HealthStatus'
  schemas:
    LessonExerciseSummary:
      type: object
      required: [id, title, language]
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        language: {type: string, example: python}
    CourseContentSlug:
      type: string
      maxLength: 100
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    UpdateCourse:
      type: object
      required: [title, summary]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        summary: {type: string, minLength: 1, maxLength: 500}
    CreateCourse:
      allOf:
        - $ref: '#/components/schemas/UpdateCourse'
        - type: object
          required: [slug]
          properties:
            slug:
              $ref: '#/components/schemas/CourseContentSlug'
    UpdateLesson:
      type: object
      required: [title, bodyMarkdown]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        bodyMarkdown: {type: string, minLength: 1, maxLength: 50000}
    CreateLesson:
      allOf:
        - $ref: '#/components/schemas/UpdateLesson'
        - type: object
          required: [slug]
          properties:
            slug:
              $ref: '#/components/schemas/CourseContentSlug'
    CoursePublication:
      type: object
      required: [published]
      properties:
        published: {type: boolean}
    LessonOrder:
      type: object
      description: Cung cấp tất cả slug bài học đúng một lần, kể cả bài nháp.
      required: [lessonSlugs]
      properties:
        lessonSlugs:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
    AdminCourseItem:
      allOf:
        - $ref: '#/components/schemas/CourseSummary'
        - type: object
          required: [publishedAt]
          properties:
            publishedAt: {type: string, format: date-time, nullable: true}
    AdminCourseDetail:
      allOf:
        - $ref: '#/components/schemas/AdminCourseItem'
        - type: object
          required: [lessons]
          properties:
            lessons:
              type: array
              items:
                $ref: '#/components/schemas/AdminLessonItem'
    AdminCoursePage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminCourseItem'
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 50}
        totalElements: {type: integer, format: int64, minimum: 0}
    AdminLessonItem:
      allOf:
        - $ref: '#/components/schemas/LessonSummary'
        - type: object
          required: [publishedAt]
          properties:
            publishedAt: {type: string, format: date-time, nullable: true}
    AdminLessonDetail:
      allOf:
        - $ref: '#/components/schemas/AdminLessonItem'
        - type: object
          required: [bodyMarkdown]
          properties:
            bodyMarkdown: {type: string}
    CsrfToken:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
          example: X-CSRF-TOKEN
        token:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
    RegisterAccount:
      allOf:
        - $ref: '#/components/schemas/LoginRequest'
        - type: object
          properties:
            password:
              type: string
              minLength: 15
    AccountView:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        role:
          type: string
          enum: [LEARNER, AUTHOR, ADMIN]
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP
    ProblemDetail:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
          example: /api/v1/courses
        code:
          type: string
          description: Mã lỗi ổn định cho frontend.
          example: VALIDATION_ERROR
        traceId:
          type: string
          format: uuid
          example: 7fc54937-9385-4df5-9976-494338298a97
    CourseSummary:
      type: object
      required: [slug, title, summary]
      properties:
        slug:
          type: string
          example: python-co-ban
        title:
          type: string
          example: Python cơ bản
        summary:
          type: string
          example: Làm quen với cú pháp Python qua các ví dụ ngắn.
    CoursePage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CourseSummary'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: Tổng số khóa học đã xuất bản.
    CourseDetail:
      allOf:
        - $ref: '#/components/schemas/CourseSummary'
        - type: object
          required: [lessons]
          properties:
            lessons:
              type: array
              items:
                $ref: '#/components/schemas/LessonSummary'
    LessonSummary:
      type: object
      required: [slug, title, position]
      properties:
        slug:
          type: string
          example: xin-chao-python
        title:
          type: string
          example: Xin chào, Python
        position:
          type: integer
          format: int32
          minimum: 1
          example: 1
    LessonDetail:
      allOf:
        - $ref: '#/components/schemas/LessonSummary'
        - type: object
          required: [courseSlug, bodyMarkdown]
          properties:
            courseSlug:
              type: string
              example: python-co-ban
            bodyMarkdown:
              type: string
              description: Mã nguồn Markdown của bài học.
            previousLessonSlug:
              type: string
              nullable: true
              description: Slug của bài đã xuất bản đứng trước.
            nextLessonSlug:
              type: string
              nullable: true
              description: Slug của bài đã xuất bản đứng sau.
    ExerciseView:
      type: object
      required: [id, lessonId, title, language, difficulty, statementMarkdown, starterCode, maxScore, publicTests]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        lessonId:
          type: integer
          format: int64
        title:
          type: string
          example: Tính tổng hai số
        language:
          type: string
          example: python
        difficulty:
          type: string
          example: beginner
        statementMarkdown:
          type: string
          description: Đề bài dạng Markdown.
        starterCode:
          type: string
        maxScore:
          type: integer
          minimum: 1
          example: 100
        publicTests:
          type: array
          items:
            $ref: '#/components/schemas/PublicTestCase'
    PublicTestCase:
      type: object
      required: [position, stdin, expectedOutput]
      properties:
        position:
          type: integer
          format: int32
          minimum: 1
        stdin:
          type: string
        expectedOutput:
          type: string
    CreateSubmission:
      type: object
      required: [language, source_code]
      additionalProperties: false
      properties:
        language:
          type: string
          enum: [python]
        source_code:
          type: string
          minLength: 1
    SubmissionReceipt:
      type: object
      required: [submission_id, status, verdict, created_at]
      properties:
        submission_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [QUEUED]
        verdict:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    SubmissionView:
      type: object
      required: [submission_id, exercise_id, status, verdict, score, max_score, created_at, tests]
      properties:
        submission_id:
          type: integer
          format: int64
        exercise_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [QUEUED, RUNNING, DONE, FAILED]
        verdict:
          type: string
          nullable: true
          enum: [ACCEPTED, WRONG_ANSWER, TIME_LIMIT, MEMORY_LIMIT, RUNTIME_ERROR, COMPILE_ERROR]
        score:
          type: number
          nullable: true
        max_score:
          type: integer
        time_ms:
          type: integer
          nullable: true
        memory_kb:
          type: integer
          nullable: true
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        tests:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionTestResult'
    SubmissionTestResult:
      type: object
      required: [position, public, passed, verdict]
      properties:
        position:
          type: integer
        public:
          type: boolean
        passed:
          type: boolean
        verdict:
          type: string
          enum: [ACCEPTED, WRONG_ANSWER, TIME_LIMIT, MEMORY_LIMIT, RUNTIME_ERROR, COMPILE_ERROR]
        time_ms:
          type: integer
          nullable: true
        memory_kb:
          type: integer
          nullable: true
        stdin:
          type: string
        expected_output:
          type: string
        actual_output:
          type: string
    SubmissionDetail:
      allOf:
        - $ref: '#/components/schemas/SubmissionView'
        - type: object
          required: [language, source_code]
          properties:
            language:
              type: string
            source_code:
              type: string
    SubmissionSummary:
      type: object
      required: [submission_id, status, verdict, score, created_at]
      properties:
        submission_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [QUEUED, RUNNING, DONE, FAILED]
        verdict:
          type: string
          nullable: true
          enum: [ACCEPTED, WRONG_ANSWER, TIME_LIMIT, MEMORY_LIMIT, RUNTIME_ERROR, COMPILE_ERROR]
        score:
          type: number
          nullable: true
        time_ms:
          type: integer
          nullable: true
        memory_kb:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
    SubmissionPage:
      type: object
      required: [items, page, size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionSummary'
        page:
          type: integer
        size:
          type: integer
